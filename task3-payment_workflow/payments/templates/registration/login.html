<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

</head>

<body>

<div style="
    max-width:400px;
    margin:80px auto;
    font-family:Arial;
">

    <h1>
        Login
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            style="
                padding:10px 20px;
                background:#111;
                color:white;
                border:0;
            "
        >
            Login
        </button>

    </form>

</div>

</body>

</html>
